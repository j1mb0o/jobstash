{% extends "base.html" %}

{% block title %}Job search · LinkedIn Job Search{% endblock %}

{% block content %}
<!-- <section class="page-heading">
  <h1>Job search</h1>
</section> -->

<form class="search-card" id="search-form" action="#" method="post" onsubmit="event.preventDefault();">
  <div class="search-grid">
    <div class="search-field-group wide">
      <label for="positions">Positions (comma or new line)</label>
      <textarea id="positions" name="positions" rows="2" placeholder="ML Engineer">ML Engineer</textarea>
    </div>

    <div class="search-field-group wide">
      <label for="location">Country / Location</label>
      <input id="location" name="location" type="text" value="Netherlands">
    </div>

    <div class="search-field-group">
      <label for="experience">Experience level</label>
      <select id="experience" name="experience">
        <option value="" selected>Any</option>
        <option value="entry">Entry level</option>
        <option value="associate">Associate</option>
        <option value="mid-senior">Mid-Senior level</option>
        <option value="director">Director</option>
        <option value="executive">Executive</option>
      </select>
    </div>

    <div class="search-field-group">
      <label for="posted">Posted</label>
      <select id="posted" name="posted">
        <option value="any" selected>Any time</option>
        <option value="24h">Past 24 hours</option>
        <option value="week">Past week</option>
        <option value="month">Past month</option>
      </select>
    </div>

    <div class="search-field-group">
      <label for="job_type">Job type</label>
      <select id="job_type" name="job_type">
        <option value="" selected>Any</option>
        <option value="full-time">Full-time</option>
        <option value="part-time">Part-time</option>
        <option value="contract">Contract</option>
        <option value="internship">Internship</option>
        <option value="temporary">Temporary</option>
        <option value="volunteer">Volunteer</option>
      </select>
    </div>

    <div class="search-field-group">
      <label for="work_model">Work model</label>
      <select id="work_model" name="work_model">
        <option value="" selected>Any</option>
        <option value="on-site">On-site</option>
        <option value="remote">Remote</option>
        <option value="hybrid">Hybrid</option>
      </select>
    </div>

    <div class="search-checkboxes">
      <label class="checkbox-label">
        <input type="checkbox" name="easy_apply" id="easy_apply">
        <span>Easy Apply only</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" name="under_10_applicants" id="under_10_applicants">
        <span>Under 10 applicants</span>
      </label>
    </div>
  </div>

  <hr class="search-divider">

  <!-- <div class="search-actions">
    <div class="queries-status">
      <span class="queries-count">0 search queries generated</span>
      <button type="button" class="text-button" id="edit-queries">Edit</button>
    </div> -->
    <div class="action-buttons">
      <button type="button" class="button secondary" id="schedule-daily" aria-haspopup="dialog">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
        Schedule daily
      </button>
      <button type="button" class="button" id="fetch-jobs">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        Fetch now
      </button>
    </div>
  </div>
</form>

<section class="advanced-card">
  <button type="button" class="advanced-toggle" aria-expanded="false" aria-controls="advanced-panel" id="advanced-toggle">
    <span>Advanced options</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <div id="advanced-panel" class="advanced-panel" hidden>
    <div class="advanced-grid">
      <div class="search-field-group">
        <label for="pages_per_query">Pages per query</label>
        <input id="pages_per_query" name="pages_per_query" type="number" min="1" max="10" value="3">
      </div>
      <div class="search-field-group">
        <label for="request_delay">Request delay (seconds)</label>
        <input id="request_delay" name="request_delay" type="number" min="1" max="30" value="3">
      </div>
      <div class="search-field-group">
        <label for="fetch_descriptions" class="checkbox-label">
          <input type="checkbox" name="fetch_descriptions" id="fetch_descriptions" checked>
          <span>Fetch full descriptions</span>
        </label>
      </div>
    </div>
  </div>
</section>

<section class="search-result" id="search-result" hidden>
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 12 2 2 4-4"/></svg>
  <span id="result-message">0 new jobs saved</span>
  <a href="/jobs" class="text-link">View database →</a>
</section>

<div class="modal-overlay" id="schedule-modal" role="dialog" aria-modal="true" aria-labelledby="schedule-title" hidden>
  <div class="modal-card">
    <div class="modal-header">
      <h2 id="schedule-title">Schedule daily search</h2>
      <button type="button" class="modal-close" id="modal-close" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <p class="modal-lede">This search will run automatically every day and save new jobs to your database.</p>
      <div class="search-field-group">
        <label for="schedule-time">Run at (UTC)</label>
        <input id="schedule-time" name="schedule_time" type="time" value="08:00">
      </div>
      <div class="search-field-group">
        <label class="checkbox-label">
          <input type="checkbox" name="schedule_fetch_descriptions" id="schedule-fetch-descriptions" checked>
          <span>Fetch full descriptions</span>
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="button secondary" id="modal-cancel">Cancel</button>
      <button type="button" class="button" id="modal-save">Save schedule</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  const toggle = document.getElementById('advanced-toggle');
  const panel = document.getElementById('advanced-panel');
  if (toggle && panel) {
    toggle.addEventListener('click', function() {
      const expanded = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!expanded));
      panel.hidden = expanded;
      toggle.querySelector('svg').style.transform = expanded ? 'rotate(0deg)' : 'rotate(180deg)';
    });
  }

  const modal = document.getElementById('schedule-modal');
  const openBtn = document.getElementById('schedule-daily');
  const closeBtn = document.getElementById('modal-close');
  const cancelBtn = document.getElementById('modal-cancel');

  function openModal() {
    if (!modal) return;
    modal.hidden = false;
    document.body.style.overflow = 'hidden';
    const timeInput = document.getElementById('schedule-time');
    if (timeInput) timeInput.focus();
  }

  function closeModal() {
    if (!modal) return;
    modal.hidden = true;
    document.body.style.overflow = '';
    if (openBtn) openBtn.focus();
  }

  if (openBtn) openBtn.addEventListener('click', openModal);
  if (closeBtn) closeBtn.addEventListener('click', closeModal);
  if (cancelBtn) cancelBtn.addEventListener('click', closeModal);
  if (modal) {
    modal.addEventListener('click', function(e) {
      if (e.target === modal) closeModal();
    });
    modal.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeModal();
    });
  }

  const fetchBtn = document.getElementById('fetch-jobs');
  const resultSection = document.getElementById('search-result');
  const resultMessage = document.getElementById('result-message');
  const searchForm = document.getElementById('search-form');
  let resultTimeout = null;

  function showResult(message) {
    if (resultMessage) resultMessage.textContent = message;
    if (resultSection) resultSection.hidden = false;
    if (resultTimeout) clearTimeout(resultTimeout);
    resultTimeout = setTimeout(function() {
      if (resultSection) resultSection.hidden = true;
    }, 5000);
  }

  function hideResult() {
    if (resultSection) resultSection.hidden = true;
    if (resultTimeout) {
      clearTimeout(resultTimeout);
      resultTimeout = null;
    }
  }

  if (searchForm) {
    searchForm.addEventListener('input', hideResult);
    searchForm.addEventListener('change', hideResult);
  }

  function collectFormValues() {
    const form = document.getElementById('search-form');
    if (!form) return {};
    const values = {};
    for (const field of form.elements) {
      if (!field.name) continue;
      if (field.type === 'checkbox') {
        values[field.name] = field.checked;
      } else {
        values[field.name] = field.value;
      }
    }
    return values;
  }

  if (fetchBtn) {
    fetchBtn.addEventListener('click', async function() {
      fetchBtn.disabled = true;
      fetchBtn.textContent = 'Fetching...';

      console.log('Fetch now clicked. Field values:', collectFormValues());

      try {
        const response = await fetch('/search/fetch', { method: 'POST' });
        if (!response.ok) {
          throw new Error('Failed to fetch jobs');
        }
        const data = await response.json();
        showResult(data.new_jobs + ' new jobs saved');
      } catch (err) {
        console.error(err);
        showResult('Something went wrong. Please try again.');
      } finally {
        fetchBtn.disabled = false;
        fetchBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>Fetch now';
      }
    });
  }
})();
</script>
{% endblock %}
