{% extends "base.html" %}

{% block title %}Job search · JobStash{% endblock %}

{% block content %}
<form class="search-card" id="search-form" onsubmit="event.preventDefault();">
  <div class="search-grid">
    <div class="search-field-group wide">
      <label for="position_text">Positions (comma or new line)</label>
      <textarea id="position_text" name="position_text" rows="2" placeholder="ML Engineer, Data Scientist">ML Engineer</textarea>
    </div>

    <div class="search-field-group">
      <label for="seniority">Seniority</label>
      <select id="seniority" name="seniority">
        {% for label, value in seniority_choices %}
          <option value="{{ value }}" {% if value == default_seniority %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="search-field-group">
      <label for="location">Country / Location</label>
      <input id="location" name="location" type="text" value="{{ default_location }}">
    </div>

    <div class="search-field-group">
      <label for="time_posted">Posted</label>
      <select id="time_posted" name="time_posted">
        {% for label, value in time_posted_choices %}
          <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="search-checkboxes">
      <label class="checkbox-label">
        <input type="checkbox" name="easy_apply" id="easy_apply">
        <span>Easy Apply only</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" name="under_10_applicants" id="under_10_applicants">
        <span>Under 10 applicants</span>
      </label>
    </div>
  </div>

  <hr class="search-divider">

  <div class="queries-block">
    <div class="queries-header">
      <label for="query_text">Search queries</label>
      <button type="button" class="text-button" id="generate-queries">Generate queries</button>
    </div>
    <textarea id="query_text" name="query_text" rows="4" placeholder="Generated queries appear here — edit freely"></textarea>
    <p class="muted queries-count" id="queries-count">No queries generated.</p>
  </div>

  <div class="search-actions">
    <div class="action-buttons">
      <button type="button" class="button" id="fetch-jobs">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        Fetch now
      </button>
    </div>
  </div>
</form>

<section class="advanced-card" id="saved-configs-card">
  <div class="queries-header">
    <label for="config-select">Saved configs (CLI + schedule)</label>
  </div>
  <div class="advanced-grid">
    <div class="search-field-group">
      <label for="config-select">Saved config</label>
      <select id="config-select"><option value="">Select a saved config…</option></select>
    </div>
    <div class="search-field-group">
      <label for="config-name">Save current form as</label>
      <input id="config-name" name="config-name" type="text" placeholder="e.g. ml-nl-junior">
    </div>
  </div>
  <div class="search-actions">
    <div class="action-buttons">
      <button type="button" class="button" id="save-config">Save</button>
    </div>
  </div>
  <p class="muted" id="config-status">Configs live in <code>configs/*.json</code> — the CLI runs them with <code>--all</code>.</p>
</section>

<section class="advanced-card">
  <button type="button" class="advanced-toggle" aria-expanded="false" aria-controls="advanced-panel" id="advanced-toggle">
    <span>Advanced options</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <div id="advanced-panel" class="advanced-panel" hidden>
    <div class="advanced-grid">
      <div class="search-field-group">
        <label for="max_pages">Pages per query</label>
        <input id="max_pages" name="max_pages" type="number" min="1" max="10" value="3">
      </div>
      <div class="search-field-group">
        <label for="detail_delay_seconds">Request delay (seconds)</label>
        <input id="detail_delay_seconds" name="detail_delay_seconds" type="number" min="0" max="30" step="0.5" value="{{ default_request_delay_seconds }}">
      </div>
      <div class="search-field-group">
        <label for="include_details" class="checkbox-label">
          <input type="checkbox" name="include_details" id="include_details" {% if default_fetch_descriptions %}checked{% endif %}>
          <span>Fetch full descriptions</span>
        </label>
      </div>
    </div>
  </div>
</section>

<section class="search-result" id="search-result" hidden>
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 12 2 2 4-4"/></svg>
  <span id="result-message">0 new jobs saved</span>
  <a href="/jobs" class="text-link">View database →</a>
</section>

<p class="error-message" id="search-error" role="alert" hidden></p>
{% endblock %}

{% block scripts %}
<script>
(function() {
  const form = document.getElementById('search-form');
  const generateBtn = document.getElementById('generate-queries');
  const fetchBtn = document.getElementById('fetch-jobs');
  const queriesField = document.getElementById('query_text');
  const queriesCount = document.getElementById('queries-count');
  const resultSection = document.getElementById('search-result');
  const resultMessage = document.getElementById('result-message');
  const errorBox = document.getElementById('search-error');
  let resultTimeout = null;

  const toggle = document.getElementById('advanced-toggle');
  const panel = document.getElementById('advanced-panel');
  if (toggle && panel) {
    toggle.addEventListener('click', function() {
      const expanded = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!expanded));
      panel.hidden = expanded;
      toggle.querySelector('svg').style.transform = expanded ? 'rotate(0deg)' : 'rotate(180deg)';
    });
  }

  function showError(message) {
    errorBox.textContent = message;
    errorBox.hidden = false;
  }

  function hideError() {
    errorBox.hidden = true;
    errorBox.textContent = '';
  }

  function showResult(message) {
    resultMessage.textContent = message;
    resultSection.hidden = false;
    if (resultTimeout) clearTimeout(resultTimeout);
    resultTimeout = setTimeout(function() { resultSection.hidden = true; }, 8000);
  }

  function hideResult() {
    resultSection.hidden = true;
    if (resultTimeout) { clearTimeout(resultTimeout); resultTimeout = null; }
  }

  function updateQueriesCount() {
    const lines = queriesField.value.split('\n').filter(function(line) { return line.trim(); });
    queriesCount.textContent = lines.length + (lines.length === 1 ? " query" : " queries");
  }

  function collectPayload() {
    return {
      position_text: document.getElementById('position_text').value,
      seniority: document.getElementById('seniority').value,
      query_text: queriesField.value,
      location: document.getElementById('location').value,
      time_posted: document.getElementById('time_posted').value,
      easy_apply: document.getElementById('easy_apply').checked,
      under_10_applicants: document.getElementById('under_10_applicants').checked,
      max_pages: parseInt(document.getElementById('max_pages').value, 10) || 1,
      include_details: document.getElementById('include_details').checked,
      detail_delay_seconds: parseFloat(document.getElementById('detail_delay_seconds').value) || 0,
    };
  }

  if (generateBtn) {
    generateBtn.addEventListener('click', async function() {
      generateBtn.disabled = true;
      generateBtn.textContent = 'Generating...';
      hideError();
      try {
        const response = await fetch('/search/queries', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            position_text: document.getElementById('position_text').value,
            seniority: document.getElementById('seniority').value,
          }),
        });
        if (!response.ok) throw new Error('Failed to generate queries');
        const data = await response.json();
        queriesField.value = data.queries.join('\n');
        updateQueriesCount();
      } catch (err) {
        console.error(err);
        showError('Could not generate queries. Please try again.');
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = 'Generate queries';
      }
    });
  }

  if (fetchBtn) {
    fetchBtn.addEventListener('click', async function() {
      fetchBtn.disabled = true;
      fetchBtn.textContent = 'Fetching...';
      hideError();
      hideResult();
      try {
        const response = await fetch('/search/fetch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(collectPayload()),
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || 'Failed to fetch jobs');
        }
        showResult(data.message);
      } catch (err) {
        console.error(err);
        showError(err.message || 'Something went wrong. Please try again.');
      } finally {
        fetchBtn.disabled = false;
        fetchBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>Fetch now';
      }
    });
  }

  if (queriesField) queriesField.addEventListener('input', updateQueriesCount);
  if (form) {
    form.addEventListener('input', hideResult);
    form.addEventListener('change', hideResult);
  }

  const configSelect = document.getElementById('config-select');
  const configName = document.getElementById('config-name');
  const configStatus = document.getElementById('config-status');
  const saveConfigBtn = document.getElementById('save-config');

  function setConfigStatus(message) {
    if (configStatus) configStatus.textContent = message;
  }

  function applyConfigToForm(config) {
    const setValue = function(id, value) {
      const el = document.getElementById(id);
      if (el && value !== undefined && value !== null) el.value = value;
    };
    const setChecked = function(id, value) {
      const el = document.getElementById(id);
      if (el) el.checked = Boolean(value);
    };
    setValue('position_text', config.position_text || '');
    setValue('seniority', config.seniority || 'Junior');
    setValue('location', config.location || '');
    setValue('time_posted', config.time_posted || '');
    setChecked('easy_apply', config.easy_apply);
    setChecked('under_10_applicants', config.under_10_applicants);
    setValue('query_text', (config.query_text || '').trim() ? config.query_text : (config.queries || []).join('\n'));
    if (config.query_text) queriesField.value = config.query_text;
    setValue('max_pages', config.max_pages || 1);
    setValue('detail_delay_seconds', config.detail_delay_seconds !== undefined ? config.detail_delay_seconds : 1.5);
    setChecked('include_details', config.include_details !== false);
    updateQueriesCount();
  }

  async function refreshConfigList() {
    if (!configSelect) return;
    try {
      const response = await fetch('/api/search-configs');
      if (!response.ok) throw new Error('Failed to list configs');
      const data = await response.json();
      const current = configSelect.value;
      configSelect.innerHTML = '<option value="">Select a saved config…</option>';
      (data.configs || []).forEach(function(name) {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        configSelect.appendChild(opt);
      });
      if (current && data.configs.includes(current)) configSelect.value = current;
      setConfigStatus('Configs live in configs/*.json — the CLI runs them with --all.');
    } catch (err) {
      console.error(err);
      setConfigStatus('Could not list saved configs.');
    }
  }

  if (configSelect) {
    configSelect.addEventListener('change', async function() {
      const name = configSelect.value;
      if (!name) return;
      hideError();
      try {
        const response = await fetch('/api/search-configs/' + encodeURIComponent(name));
        if (!response.ok) throw new Error('Failed to load config');
        const config = await response.json();
        applyConfigToForm(config);
        if (configName) configName.value = config.name || name;
        setConfigStatus('Loaded "' + (config.name || name) + '". Edit and Fetch, or Save under a new name.');
      } catch (err) {
        console.error(err);
        showError('Could not load the selected config.');
      }
    });
  }

  if (saveConfigBtn) {
    saveConfigBtn.addEventListener('click', async function() {
      const name = configName ? configName.value.trim() : '';
      if (!name) { setConfigStatus('Type a name before saving.'); return; }
      const selected = configSelect ? configSelect.value : '';
      if (selected && selected === name && !window.confirm('Overwrite "' + name + '"?')) return;
      hideError();
      try {
        const payload = collectPayload();
        payload.name = name;
        const response = await fetch('/api/search-configs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Failed to save config');
        setConfigStatus('Saved "' + data.name + '" → configs/' + data.file);
        await refreshConfigList();
        if (configSelect) configSelect.value = data.name;
      } catch (err) {
        console.error(err);
        showError(err.message || 'Could not save config.');
      }
    });
  }

  refreshConfigList();
})();
</script>
{% endblock %}
