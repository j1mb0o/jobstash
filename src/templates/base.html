<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}JobStash{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', path='/img/logo-nobg.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='/img/logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <img src="{{ url_for('static', path='/img/logo-nobg.png') }}" alt="JobStash logo" width="28" height="28">
      JobStash
    </a>
    <nav aria-label="Main navigation">
      <a class="nav-link" href="/search">Search</a>
      <a class="nav-link" href="/jobs">Job database</a>
    </nav>
  </header>
  <main class="page-shell">{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
